<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field notes · ห้าโลกของ solo creator</title>
<meta name="description" content="Five small worlds drawn in pen and pencil, each a statechart checked by TLC. Tap everything.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Sarabun:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --page:#e2dac8; --paper:#eee9dc; --ink:#2a231f; --muted:#7a7266; --btn:#f4efe3; --shadow:#d3c9b3; --thread:#b5453a; --accent:#b5453a;
}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Courier Prime','Sarabun',ui-monospace,monospace;line-height:1.5;-webkit-tap-highlight-color:transparent;transition:background .5s,color .5s}
body.dusk{--page:#3a3750; --paper:#cfcdd8; --ink:#f1ecdf; --muted:#b4aec4; --btn:#4a4663; --shadow:#2c2a3e; --accent:#ff9d8f}
main{max-width:560px;margin:0 auto;padding:18px 14px 56px}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tab{font:400 17px 'Courier Prime','Sarabun',monospace;letter-spacing:.06em;color:var(--ink);background:var(--btn);border:2.5px solid var(--ink);border-radius:7px;padding:9px 16px;cursor:pointer;min-height:44px;transition:background .2s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--page)}
.plate{position:relative;margin:20px 8px 0 0;box-shadow:9px 9px 0 var(--shadow);background:var(--paper);transition:background .5s,box-shadow .5s}
svg#plate{display:block;width:100%;height:auto;touch-action:manipulation}
svg text{font-family:'Courier Prime','Sarabun',monospace}
.obj{cursor:pointer}
.ring{fill:none;stroke:var(--thread);stroke-width:3;stroke-dasharray:7 6;opacity:0;transition:opacity .3s}
.ring.on{opacity:.95;animation:march 1.1s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.obj.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hop{animation:hop .45s ease-out}
@keyframes hop{40%{transform:translateY(-8px)}}
.token{transition:transform .65s cubic-bezier(.4,.1,.2,1)}
.bubble{pointer-events:none;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.win{fill:#f4f1e4;transition:fill .5s}
body.dusk .win{fill:#ffd978}
.glow{opacity:0;transition:opacity .5s}
body.dusk .glow{opacity:.9}
#veil{opacity:0;mix-blend-mode:multiply;transition:opacity .6s;pointer-events:none}
body.dusk #veil{opacity:.32}
.under{display:flex;gap:14px;align-items:flex-start;margin:24px 8px 0 0}
.dusk-btn{flex:none;font:400 21px 'Courier Prime','Sarabun',monospace;letter-spacing:.06em;color:var(--accent);background:var(--btn);border:2.5px solid var(--accent);border-radius:7px;padding:12px 18px;cursor:pointer;min-height:48px}
.hint{flex:1;font-size:21px;font-style:italic;line-height:1.35;min-height:2.8em}
.hint b{font-weight:700}
.hint.bad{color:var(--accent)}
.tag{margin:12px 0 0;text-align:center;color:var(--muted);letter-spacing:.14em;font-size:16px}
details{margin:14px 6px 0;font-size:14.5px;color:var(--ink)}
summary{cursor:pointer;color:var(--muted);letter-spacing:.06em}
ul.rules{list-style:none;margin:8px 0 0;padding:0}
ul.rules li{padding:5px 0 5px 24px;position:relative;border-bottom:1px dashed var(--muted)}
ul.rules li::before{content:"✓";position:absolute;left:3px;color:#4f8a63;font-weight:700}
ul.rules li.broken{color:var(--accent)}
ul.rules li.broken::before{content:"✗";color:var(--accent)}
.reset{font:400 14px 'Courier Prime','Sarabun',monospace;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;padding:10px 4px}
.credit{margin:22px 6px 0;text-align:center;font-style:italic;font-size:17px;color:var(--muted);line-height:1.6}
.credit a{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="plate"><svg id="plate" viewBox="0 0 1000 1000" role="img" aria-label="isometric scene"></svg></div>
  <div class="under"><button class="dusk-btn" id="dusk" type="button">dusk</button><div class="hint" id="hint" aria-live="polite"></div></div>
  <p class="tag" id="tag">ทุกคนพูดได้</p>
  <details id="rules"><summary>กฎที่ TLC ตรวจแล้ว</summary><ul class="rules" id="rulelist"></ul><button class="reset" id="reset" type="button">เริ่มใหม่</button></details>
  <p class="credit">ลายเส้นและสไตล์ดัดแปลงจาก <a href="https://april-zhu.com/fieldnotes">Field Notes</a> ของ April Zhu และ <a href="https://kevintngo.github.io/statechart-art/">statechart-art</a> ของ Kevin T. Ngo · กฎตรวจด้วย <a href="https://github.com/tlaplus/tlaplus">TLC</a> · โค้ดหน้านี้เขียนใหม่ทั้งหมด</p>
</main>

<script>

    {at:'mail',why:'ยังมี flag ค้างอยู่ ส่งไม่ได้',say:'ส่งไฟล์แล้ว!',guard:function(v){return v.s==='rendered'&&v.flags===0;},apply:function(v){v.s='delivered';}}],
  rules:[{t:'ส่งไฟล์ได้เมื่อ QA ไม่มี flag',n:'DeliveredIsClean',ok:function(v){return v.s!=='delivered'||v.flags===0;}}],
  tlc:'TLC ตรวจ 8 สถานะ ไม่พบบั๊ก',trace:''},
{ id:'bot',tab:'IV',name:'บอท LINE',kicker:'field notes · สองฝั่งพร้อมกัน',title:'บอทตอบ LINE',

{ id:'sat',tab:'V',name:'เสาร์ช้าๆ',kicker:'field notes · หนึ่งวันเสาร์',title:'เสาร์ช้าๆ',tokenPerson:true,

  tickets:[['bed','นอนต่อ','ยังไม่ตั้งนาฬิกาปลุก','L',0],['coffee','กาแฟ','แก้วแรกของวัน','L',1],['table','มื้อเย็น','อิ่มแล้วค่อยว่ากัน','L',3],
           ['laptop','โปรเจกต์ข้าง','เปิดได้เมื่อมีกาแฟ','R',0],['sofa','งีบ','หลังทำงาน','R',1],['lamp','ปิดวัน','จบวันเสาร์','R',3]],

  actions:[
    {at:'bed',why:'ตื่นได้ตอนยังนอนอยู่',say:'ตื่นแล้ว หิวกาแฟ',guard:function(v){return v.s==='asleep';},apply:function(v){v.s='coffee';v.cups=1;}},
    {at:'laptop',why:'ต้องมีกาแฟก่อน',say:'ลุยโปรเจกต์',guard:function(v){return v.s==='coffee'&&v.cups>=1;},apply:function(v){v.s='project';v.tired=true;}},
    {at:'sofa',why:'งีบหลังทำงานเท่านั้น',say:'ขอสิบนาที…',guard:function(v){return v.s==='project'&&v.tired;},apply:function(v){v.s='nap';v.tired=false;}},
    {at:'coffee',why:'เติมได้ตอนงีบเสร็จ และไม่เกิน 2 แก้ว',say:'อีกแก้ว!',guard:function(v){return v.s==='nap'&&v.cups<2;},apply:function(v){v.s='coffee';v.cups+=1;}},
    {at:'table',why:'ต้องงีบเสร็จก่อน',say:'หอมจัง',guard:function(v){return v.s==='nap';},apply:function(v){v.s='dinner';}},
    {at:'lamp',why:'ต้องกินข้าวเย็นก่อน',say:'ราตรีสวัสดิ์',guard:function(v){return v.s==='dinner';},apply:function(v){v.s='night';}}],
  rules:[{t:'เปิดโปรเจกต์ได้เมื่อมีกาแฟแล้ว',ok:function(v){return v.s!=='project'||v.cups>=1;}},{t:'ตอนงีบต้องไม่เหนื่อยค้าง',ok:function(v){return v.s!=='nap'||!v.tired;}}],
  tlc:'TLC ตรวจ 11 สถานะ ไม่พบบั๊ก',trace:''}

/* ---------------- the stage ---------------- */
var svg=document.getElementById('plate'),tabsEl=document.getElementById('tabs'),hintEl=document.getElementById('hint');
var cur=0,v=null,history=[],busy=false,els={};
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function svgText(x,y,t,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.fs||22)+'" text-anchor="'+(o.anchor||'start')+'" fill="'+(o.fill||INK)+'" '+(o.italic?'font-style="italic" ':'')+(o.w?'font-weight="'+o.w+'" ':'')+'stroke="none">'+t+'</text>';}

function buildTabs(){tabsEl.innerHTML='';worlds.forEach(function(w,i){var b=document.createElement('button');b.className='tab';b.type='button';b.setAttribute('role','tab');b.textContent=w.tab+'  '+w.name;b.onclick=function(){select(i);};tabsEl.appendChild(b);});}

function select(i){cur=i;var w=worlds[i];v=w.init();history=[];busy=false;
  Array.prototype.forEach.call(tabsEl.children,function(b,k){b.setAttribute('aria-selected',k===i?'true':'false');});
  draw(w);render();}

function draw(w){
  svg.innerHTML='';
  var defs='<defs><filter id="pen" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter>'
   +'<filter id="tex" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9" result="t"/><feColorMatrix in="t" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0.55 -0.2"/></filter>'
   +'<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-50)"><line x1="0" y1="0" x2="0" y2="7" stroke="#6b5a45" stroke-width="1.1" opacity=".5"/></pattern></defs>';
  svg.innerHTML=defs+'<rect width="1000" height="1000" fill="var(--paper)"/><rect width="1000" height="1000" filter="url(#tex)" opacity=".5"/>';
  var scene=el('g',{filter:'url(#pen)',transform:'translate(500 '+CY+') scale('+SS+') translate(-500 '+(-CY)+')'},svg);
  // slab
  var top=[P(0,0),P(10,0),P(10,10),P(0,10)],th=40;
  var Lf=[P(0,10),P(10,10),[P(10,10)[0],P(10,10)[1]+th],[P(0,10)[0],P(0,10)[1]+th]];
  var Rf=[P(10,0),P(10,10),[P(10,10)[0],P(10,10)[1]+th],[P(10,0)[0],P(10,0)[1]+th]];
  var g=poly(Lf,'#b99a74')+poly(Rf,'#a5835e')+poly(top,'#aac692')+poly([P(0.25,0.25),P(9.75,0.25),P(9.75,9.75),P(0.25,9.75)],'#b7d0a0',{hatch:false,stroke:'#8fae7a',sw:1});
  [10,22,32].forEach(function(d){g+=ln([P(0,10)[0],P(0,10)[1]+d],[P(10,10)[0],P(10,10)[1]+d],'#8c6f4c',1)+ln([P(10,10)[0],P(10,10)[1]+d],[P(10,0)[0],P(10,0)[1]+d],'#8c6f4c',1);});
  if(w.flats)g+=flatsDraw(w.flats);
  // tufts
  var seed=w.id.length*7+3;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
  for(var i=0;i<26;i++){var gx=0.6+rnd()*8.8,gy=0.6+rnd()*8.8,p=P(gx,gy);g+=ln([p[0]-3,p[1]],[p[0],p[1]-6],'#6f9460',1.2)+ln([p[0]+3,p[1]],[p[0],p[1]-6],'#6f9460',1.2);}
  scene.innerHTML=g;
  // objects (depth-sorted)
  els={};var objs=w.objects.map(function(o){var d=K[o.kind](o);return {o:o,d:d,depth:o.gx+o.gy+(d.w+d.d)/2};}).sort(function(a,b){return a.depth-b.depth;});
  objs.forEach(function(it){var o=it.o,d=it.d;var cx=o.gx+d.w/2,cy=o.gy+d.d/2,a=P(cx,cy,0);
    var grp=el('g',{'class':o.id?'obj':'deco','data-id':o.id||''},scene);
    if(o.id){var ring=el('ellipse',{'class':'ring',cx:f1(a[0]),cy:f1(a[1]+6),rx:Math.max(46,d.w*TW*1.1),ry:Math.max(22,d.w*TH*1.1)},grp);var A_=T(a);els[o.id]={g:grp,ring:ring,ax:A_[0],ay:A_[1],top:A_[1]-d.h*SS};}
    var inner=el('g',{},grp);inner.innerHTML=d.svg;
    if(o.id){var hit=el('ellipse',{cx:f1(a[0]),cy:f1(a[1]-d.h/2),rx:Math.max(48,d.w*TW*1.1),ry:d.h/2+12,fill:'transparent',stroke:'none'},grp);
      grp.addEventListener('click',function(){tap(o.id);});}});
  // title block
  var t=document.createElementNS(NS,'g');svg.appendChild(t);
  t.innerHTML=svgText(70,70,w.kicker,{fs:19,fill:'var(--muted)'})+svgText(66,150,w.title,{fs:58});
  // tickets + threads
  var tk=document.createElementNS(NS,'g');svg.appendChild(tk);var th='',tt='';
  w.tickets.forEach(function(T,idx){var id=T[0],text=T[1],sub=T[2],side=T[3],slot=T[4],e=els[id];if(!e)return;
    var tw=198,tx=side==='L'?36:1000-36-tw,ty=SLOTS[side][slot],pinCol=['#dfb456','#4485b0','#cc5548'][idx%3];
    var x0=side==='L'?tx+tw:tx,y0=ty+24,ax=e.ax,ay=e.top-4,r=16,dirx=side==='L'?1:-1,ey=ay>y0?1:-1;
    var path='M'+x0+' '+y0+' H'+(ax-dirx*r)+' Q'+ax+' '+y0+' '+ax+' '+(y0+ey*r)+' V'+ay;
    th+='<path d="'+path+'" fill="none" stroke="'+THREAD+'" stroke-width="2.2" stroke-linecap="round" opacity=".85" filter="url(#pen)"/><path d="M'+(ax-5)+' '+(ay-ey*8)+' L'+ax+' '+ay+' L'+(ax+5)+' '+(ay-ey*8)+'" fill="none" stroke="'+THREAD+'" stroke-width="2.2" stroke-linecap="round"/>';
    var zz='';for(var x=tx+tw,k=0;x>tx;x-=9,k++)zz+=' '+x+','+(ty+46+(k%2?6:0));
    tt+='<g class="tk" data-id="'+id+'" style="cursor:pointer"><polygon points="'+tx+','+ty+' '+(tx+tw)+','+ty+zz+' '+tx+','+(ty+46)+'" fill="#fbf8f1" stroke="'+INK+'" stroke-width="1.8" stroke-linejoin="round"/>'
      +'<line x1="'+(tx+10)+'" y1="'+(ty+11)+'" x2="'+(tx+tw-10)+'" y2="'+(ty+11)+'" stroke="#d08c80" stroke-width="1"/>'
      +'<circle cx="'+(tx+tw/2)+'" cy="'+(ty-1)+'" r="7.5" fill="'+pinCol+'" stroke="'+INK+'" stroke-width="1.6"/>'
      +svgText(tx+tw/2,ty+34,text,{fs:20,anchor:'middle',w:700})+svgText(side==='L'?tx:tx+tw,ty+78,sub,{fs:17,anchor:side==='L'?'start':'end',italic:1,fill:'var(--ink)'})+'</g>';});
  tk.innerHTML=th+tt;
  Array.prototype.forEach.call(tk.querySelectorAll('.tk'),function(g){g.addEventListener('click',function(){tap(g.getAttribute('data-id'));});});
  // tokens, bubbles, veil, stamp
  var tokG=el('g',{id:'tokens'},svg);var bubG=el('g',{id:'bubbles'},svg);
  el('rect',{id:'veil',width:1000,height:1000,fill:'#3a3f78'},svg);
  el('g',{id:'stamp'},svg);
  els._tok=tokG;els._bub=bubG;
  // token elements
  var n=w.cur(w.init()).length;els._tokens=[];
  for(var i2=0;i2<n;i2++){var tg=el('g',{'class':'token'},tokG);
    if(w.tokenPerson){tg.innerHTML=person(0,0,{raw:1,shirt:'#d97581',style:'short',k:0.9});}
    else{tg.innerHTML='<g stroke="'+INK+'" stroke-width="1.6"><polygon points="-38,-15 38,-15 38,13 -38,13" fill="#fbf8f1"/><circle cx="-38" cy="-15" r="6.5" fill="'+['#cc5548','#4485b0'][i2%2]+'"/></g><text class="tl" x="0" y="5" font-size="16" text-anchor="middle" fill="'+INK+'" stroke="none" font-weight="700"></text>';}
    els._tokens.push(tg);}
}

function place(){var w=worlds[cur],c=w.cur(v),ch=w.chip(v);
  els._tokens.forEach(function(tg,i){var e=els[c[i]];if(!e)return;var dx=(i?-56:0)+(w.tokenPerson?58:0),dy=w.tokenPerson?18:-(e.ay-e.top)-28-(i?0:0);
    var y=w.tokenPerson?e.ay+14:e.top-26-(i*0);tg.style.transform='translate('+f1(e.ax+dx)+'px,'+f1(y)+'px)';
    var tl=tg.querySelector('.tl');if(tl)tl.textContent=ch[i]||'';});}

function render(){var w=worlds[cur];
  var ready={};w.actions.forEach(function(a){if(a.guard(v))ready[a.at]=1;});
  Object.keys(els).forEach(function(k){if(k[0]==='_'||!els[k].ring)return;els[k].ring.setAttribute('class','ring'+(ready[k]?' on':''));});
  place();
  var broken=[];w.rules.forEach(function(r){if(!r.ok(v))broken.push(r);});
  var h=document.getElementById('hint');
  if(broken.length){h.className='hint bad';h.innerHTML='<b>กฎพัง: '+(broken[0].t)+'</b><br>เส้นทางของคุณ: '+history.join(' → ')+(w.trace?'<br>TLC หาเจอเหมือนกัน: '+w.trace:'');stampOn(broken[0].t);}
  else{h.className='hint';h.innerHTML=w.hint(v);stampOff();}
  var ul=document.getElementById('rulelist');ul.innerHTML='';
  w.rules.forEach(function(r){var li=document.createElement('li');li.textContent=r.t;if(!r.ok(v))li.className='broken';ul.appendChild(li);});
  var li2=document.createElement('li');li2.style.borderBottom='none';li2.style.color='var(--muted)';li2.style.paddingLeft='0';li2.innerHTML='';li2.textContent=w.tlc;li2.style.setProperty('--x','0');ul.appendChild(li2);li2.className='note';
}
function stampOn(t){var g=document.getElementById('stamp');g.innerHTML='<g transform="rotate(-4 500 218)"><rect x="150" y="186" width="700" height="66" rx="8" fill="#fff0ee" fill-opacity=".92" stroke="#d4222f" stroke-width="5"/><text x="500" y="231" text-anchor="middle" font-size="30" font-weight="700" fill="#d4222f" stroke="none">กฎพัง: '+t+'</text></g>';}
function stampOff(){document.getElementById('stamp').innerHTML='';}

function bubble(id,text){var e=els[id];if(!e)return;els._bub.innerHTML='';
  var w=Math.max(150,text.length*17+34),x=Math.max(w/2+20,Math.min(1000-w/2-20,e.ax)),y=Math.max(190,e.top-58);
  var g=el('g',{'class':'bubble'},els._bub);
  g.innerHTML='<g stroke="'+INK+'" stroke-width="2"><rect x="'+f1(x-w/2)+'" y="'+f1(y-30)+'" width="'+w+'" height="46" rx="14" fill="#fffdf6"/><polygon points="'+f1(e.ax-8)+','+f1(y+16)+' '+f1(e.ax+8)+','+f1(y+16)+' '+f1(e.ax)+','+f1(y+30)+'" fill="#fffdf6"/><line x1="'+f1(e.ax-6)+'" y1="'+f1(y+15)+'" x2="'+f1(e.ax+6)+'" y2="'+f1(y+15)+'" stroke="#fffdf6" stroke-width="3"/></g>'
    +'<text x="'+f1(x)+'" y="'+f1(y+1)+'" text-anchor="middle" font-size="22" fill="'+INK+'" stroke="none">'+text+'</text>';
  clearTimeout(bubble._t);bubble._t=setTimeout(function(){els._bub.innerHTML='';},2400);}

function tap(id){var w=worlds[cur];if(busy)return;
  var as=w.actions.filter(function(a){return a.at===id;});if(!as.length){return;}
  var ok=as.filter(function(a){return a.guard(v);})[0];var e=els[id];
  if(!ok){if(e){e.g.classList.add('shake');setTimeout(function(){e.g.classList.remove('shake');},340);}
    bubble(id,'ยังไม่ได้: '+as[0].why);return;}
  busy=true;ok.apply(v);history.push(ok.say.replace(/[!✓⚡⚠]/g,'').trim()||ok.at);
  render();if(e){e.g.classList.add('hop');setTimeout(function(){e.g.classList.remove('hop');},480);}
  bubble(id,ok.say);setTimeout(function(){busy=false;},320);}

document.getElementById('dusk').addEventListener('click',function(){var d=document.body.classList.toggle('dusk');this.textContent=d?'dawn':'dusk';});
document.getElementById('reset').addEventListener('click',function(){select(cur);});
buildTabs();select(0);
})();
</script>
